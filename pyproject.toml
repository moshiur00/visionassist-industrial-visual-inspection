[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "visionassist"
version = "0.1.0"
description = "Industrial visual inspection and defect-explanation assistant built from VisA."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Md Moshiur Rahman" }]
keywords = ["vision-language-model", "industrial-inspection", "anomaly-detection", "visa", "qlora"]
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",
  "Pillow>=10.4,<12",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]
training = [
  "torch>=2.4",
  "torchvision",
  "transformers>=4.49",
  "datasets>=3.0",
  "accelerate>=1.0",
  "peft>=0.13",
  "trl>=0.12",
  "bitsandbytes>=0.44; platform_system != 'Windows'",
]

[project.scripts]
visionassist = "visionassist.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/visionassist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["visionassist"]
