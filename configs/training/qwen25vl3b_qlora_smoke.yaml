run_id: qwen25vl3b_qlora_smoke_v1
model_id: Qwen/Qwen2.5-VL-3B-Instruct
model_revision: null
processor_revision: null
output_dir: outputs/training/qwen25vl3b_qlora_smoke_v1
seed: 42
trust_remote_code: false
attention_implementation: sdpa
hardware_profile: auto
quantization:
  enabled: true
  load_in_4bit: true
  quant_type: nf4
