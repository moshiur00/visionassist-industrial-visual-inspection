  max_sequence_length: 2048
  image_min_pixels: 100352
  image_max_pixels: 200704
  train_limit: 1000
  validation_limit: 200
  subset_seed: 42
training:
  max_steps: 250
  num_train_epochs: 1.0
  learning_rate: 0.0002
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
