  gradient_checkpointing: true
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 5
  eval_steps: 25
  save_steps: 25
  save_total_limit: 3
  dataloader_num_workers: 0
  optim: paged_adamw_8bit
  lr_scheduler_type: cosine
  report_to: []
